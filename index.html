const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';

 g.fillStyle=mu;g.font='500 24px "IBM Plex Mono",monospace';g.textBaseline='alphabetic';g.fillText(String(c.i+1).padStart(2,'0')+' / 08',48,y0+64);

CARDS.forEach((d,i)=>{const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=4;
